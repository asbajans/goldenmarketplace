name: Deploy to Portainer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Test & Build
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Backend Tests
      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # Frontend Tests
      - name: Build seller panel
        working-directory: ./frontend/seller-panel
        run: npm run build

      - name: Build admin panel
        working-directory: ./frontend/admin-panel
        run: npm run build

      - name: Build marketplace
        working-directory: ./frontend/marketplace
        run: npm run build

  # Deploy to Portainer (git stack "golldencrftrs" — stack type untouched,
  # webhook just triggers Portainer-side git pull + redeploy)
  # NOT: Portainer docker-compose.prod.yml'deki ghcr.io image'larını çeker;
  # bu image'lar docker-build.yml workflow'unda push'lanır. Webhook'tan önce
  # image'ların hazır olması için kısa bir bekleme konuldu.
  deploy-portainer:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for Docker images (docker-build workflow)
        run: sleep 180

      - name: Trigger Portainer stack webhook
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_GOLDEN }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK" ]; then
            echo "::warning::PORTAINER_WEBHOOK_GOLDEN secret is not set, skipping Portainer deploy."
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 120 -X POST "$PORTAINER_WEBHOOK")
          echo "Portainer webhook HTTP: $HTTP"
          if [ "$HTTP" != "204" ] && [ "$HTTP" != "200" ]; then
            echo "::error::Portainer webhook failed with HTTP $HTTP"
            exit 1
          fi

  # Health Check (Portainer-served domains)
  health-check:
    needs: [deploy-portainer]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for deployment
        run: sleep 180

      - name: Check API Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://api.asb.web.tr/health)
          if [ $response -ne 200 ]; then
            echo "API Health Check Failed: $response"
            exit 1
          fi
          echo "✅ API is healthy"

      - name: Check Panels
        run: |
          # Seller
          response=$(curl -s -o /dev/null -w "%{http_code}" https://seller.asb.web.tr)
          echo "Seller Panel: $response"

          # Admin
          response=$(curl -s -o /dev/null -w "%{http_code}" https://admin.asb.web.tr)
          echo "Admin Panel: $response"

  # Notify
  notify:
    needs: [health-check]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - name: Slack Notification (via webhook)
        if: ${{ env.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK }}
        run: |
          payload='{ "text": "Golden Marketplace Deployment (Portainer)", "blocks": [{ "type": "section", "text": { "type": "mrkdwn", "text": "✅ Deployment Status: ${{ job.status }}\n🚀 Commit: ${{ github.sha }}\n👤 Author: ${{ github.actor }}" } }] }'
          curl -s -X POST -H "Content-Type: application/json" --data "$payload" "$SLACK_WEBHOOK"

      - name: Email Notification
        if: ${{ env.NOTIFICATION_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Golden Marketplace Deployment (Portainer) - ${{ job.status }}"
          body: |
            Deployment Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Portainer:
            - API: https://api.asb.web.tr
            - Seller: https://seller.asb.web.tr
            - Admin: https://admin.asb.web.tr
          to: ${{ env.NOTIFICATION_EMAIL }}
