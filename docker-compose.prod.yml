version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: golden-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-golden_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: golden_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - golden-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-golden_user} -d golden_marketplace" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migration Init
  db-migration:
    image: postgres:15-alpine
    container_name: golden-db-migration
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Running database migrations...' &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"ALTER TABLE stores ADD COLUMN IF NOT EXISTS commissionRate DECIMAL(5,2) DEFAULT 10;\" &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"ALTER TABLE stores ADD COLUMN IF NOT EXISTS defaultShippingDays INTEGER DEFAULT 3;\" &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"ALTER TABLE stores ADD COLUMN IF NOT EXISTS availableShippingCompanies JSON DEFAULT '[\\'MNG Kargo\\',\\'Yurtiçi Kargo\\']';\" &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"ALTER TABLE products ADD COLUMN IF NOT EXISTS discountRate DECIMAL(5,2) DEFAULT 0;\" &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"ALTER TABLE products ADD COLUMN IF NOT EXISTS discountedPrice DECIMAL(15,2) DEFAULT 0;\" &&
      echo 'Checking orders table...' &&
      PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"SELECT 1 FROM information_schema.tables WHERE table_name = 'orders'\" | grep -q 1 || (
        PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres -c \"
        CREATE TABLE orders (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            \"orderNumber\" VARCHAR UNIQUE NOT NULL,
            \"customerId\" UUID NOT NULL,
            \"sellerId\" UUID NOT NULL,
            \"storeId\" UUID NOT NULL,
            status VARCHAR DEFAULT 'pending',
            subtotal DECIMAL(15,2) DEFAULT 0,
            \"shippingCost\" DECIMAL(15,2) DEFAULT 0,
            \"totalAmount\" DECIMAL(15,2) DEFAULT 0,
            \"commissionRate\" DECIMAL(5,2) DEFAULT 10,
            \"commissionAmount\" DECIMAL(15,2) DEFAULT 0,
            \"sellerEarnings\" DECIMAL(15,2) DEFAULT 0,
            \"shippingTime\" INTEGER DEFAULT 3,
            \"shippingDeadline\" TIMESTAMP,
            \"trackingNumber\" VARCHAR,
            \"shippingCompany\" VARCHAR,
            \"orderDate\" TIMESTAMP DEFAULT NOW(),
            \"confirmedDate\" TIMESTAMP,
            \"shippedDate\" TIMESTAMP,
            \"deliveredDate\" TIMESTAMP,
            source VARCHAR DEFAULT 'golden',
            \"externalOrderId\" VARCHAR,
            \"shippingAddress\" JSONB,
            \"billingAddress\" JSONB,
            \"customerNote\" TEXT,
            \"createdAt\" TIMESTAMP DEFAULT NOW(),
            \"updatedAt\" TIMESTAMP DEFAULT NOW()
        );
        CREATE TABLE order_items (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            \"orderId\" UUID NOT NULL,
            \"productId\" UUID NOT NULL,
            \"variantId\" UUID,
            title VARCHAR NOT NULL,
            sku VARCHAR NOT NULL,
            quantity INTEGER DEFAULT 1,
            \"unitPrice\" DECIMAL(15,2) NOT NULL,
            \"totalPrice\" DECIMAL(15,2) NOT NULL,
            \"createdAt\" TIMESTAMP DEFAULT NOW(),
            \"updatedAt\" TIMESTAMP DEFAULT NOW()
        );
        CREATE INDEX idx_orders_orderNumber ON orders(\"orderNumber\");
        CREATE INDEX idx_orders_seller ON orders(\"sellerId\", status);
        CREATE INDEX idx_orders_store ON orders(\"storeId\", status);
        \"
      ) &&
      echo 'Database migration completed!'
      "
    environment:
      POSTGRES_USER: ${DB_USER:-golden_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: golden_marketplace
    networks:
      - golden-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: golden-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - golden-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  api:
    image: ghcr.io/asbajans/goldenmarketplace/backend:latest
    container_name: golden-api
    restart: always

    ports:
      - "777:777"

    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-golden_user}:${DB_PASSWORD}@postgres:5432/golden_marketplace

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d

      # Stripe (opsiyonel)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}

      # Gold Price API (opsiyonel)
      GOLD_PRICE_API_KEY: ${GOLD_PRICE_API_KEY:-}

      # Etsy API
      ETSY_KEY: ${ETSY_KEY:-}
      ETSY_SECRET: ${ETSY_SECRET:-}

      # App Config
      NODE_ENV: production
      PORT: 777
      FRONTEND_URL: ${FRONTEND_URL:-https://seller.asb.web.tr}

    depends_on:
      db-migration:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - golden-network

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:777/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Landing Page (asb.web.tr)
  marketplace:
    image: ghcr.io/asbajans/goldenmarketplace/marketplace:latest
    container_name: asb-landing-ui
    restart: always

    ports:
      - "5175:5175"

    environment:
      VITE_API_BASE_URL: ${API_URL:-https://api.asb.web.tr}
      NODE_ENV: production

    depends_on:
      - api

    networks:
      - golden-network

  # Seller Panel (seller.asb.web.tr)
  seller-panel:
    image: ghcr.io/asbajans/goldenmarketplace/seller-panel:latest
    container_name: asb-seller-ui
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${API_URL:-https://api.asb.web.tr}
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - golden-network

  # Admin Panel (admin.asb.web.tr)
  admin-panel:
    image: ghcr.io/asbajans/goldenmarketplace/admin-panel:latest
    container_name: asb-admin-ui
    restart: always
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: ${API_URL:-https://api.asb.web.tr}
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - golden-network

  # MinIO S3 Server
  minio:
    image: minio/minio:latest
    container_name: golden-minio
    restart: always
    ports:
      - "9100:9000" # API Port (s3.asb.web.tr)
      - "9101:9001" # Web UI Port (s3panel.asb.web.tr)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: golden123456
    volumes:
      - minio_data:/data
    networks:
      - golden-network
    command: server /data --console-address ":9001"

  # MinIO Initialization (Creates default bucket and makes it public)
  minio-init:
    image: minio/mc:latest
    container_name: golden-minio-init
    depends_on:
      - minio
    networks:
      - golden-network
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 5 &&
      /usr/bin/mc alias set myminio http://minio:9000 admin golden123456 &&
      /usr/bin/mc mb myminio/golden-bucket --ignore-existing &&
      /usr/bin/mc anonymous set download myminio/golden-bucket &&
      echo 'golden-bucket is ready and public.'
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  golden-network:
    driver: bridge
